<div class="w-full" dir="rtl">
    @if (previewUrl()) {
    <!-- معاينة الصورة -->
    <div
        class="relative rounded-xl overflow-hidden border-2 border-purple-200 dark:border-purple-700 bg-purple-50 dark:bg-purple-900/30">
        <img [src]="previewUrl()" [alt]="fileName()" class="w-full h-48 object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent flex items-end p-4">
            <div class="flex-1">
                <p class="text-white text-sm font-medium truncate">{{ fileName() }}</p>
            </div>
            <button (click)="clearImage()"
                class="bg-red-500 hover:bg-red-600 text-white p-2 rounded-full transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                        clip-rule="evenodd" />
                </svg>
            </button>
        </div>
    </div>
    } @else {
    <!-- منطقة الرفع -->
    <div class="border-2 border-dashed rounded-xl p-8 flex flex-col items-center justify-center text-center cursor-pointer transition-all duration-300"
        [class.border-gray-200]="!isDragging()" [class.dark:border-gray-600]="!isDragging()"
        [class.border-purple-500]="isDragging()" [class.bg-purple-50]="isDragging()"
        [class.dark:bg-purple-900/20]="isDragging()" [class.hover:border-purple-400]="!isDragging()"
        (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)" (drop)="onDrop($event)"
        (click)="fileInput.click()">

        <input #fileInput type="file" accept="image/*" class="hidden" (change)="onFileSelect($event)">

        <div class="w-16 h-16 rounded-full bg-purple-100 dark:bg-purple-900/50 flex items-center justify-center mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-purple-500 dark:text-purple-400" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
        </div>

        <p class="font-medium text-gray-700 dark:text-gray-300 mb-1">اسحب وأفلت صورتك هنا</p>
        <p class="text-sm text-gray-400 dark:text-gray-500 mb-4">أو</p>
        <span
            class="bg-purple-100 dark:bg-purple-900/50 text-purple-600 dark:text-purple-400 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-purple-200 dark:hover:bg-purple-800/50 transition-colors">
            تصفح الملفات
        </span>
        <p class="text-xs text-gray-400 dark:text-gray-500 mt-4">PNG, JPG, JPEG (حد أقصى 10MB)</p>
    </div>
    }
</div>
