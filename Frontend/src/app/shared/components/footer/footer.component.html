<footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 mt-16">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <img src="/assets/images/logo.png" [alt]="'app.name' | translate" class="h-6 w-auto">
                <span class="text-lg font-semibold text-gray-800 dark:text-white">{{ 'app.name' | translate }}</span>
            </div>
            <p class="text-sm text-gray-500 dark:text-gray-400">{{ 'footer.rights' | translate }}</p>
            <div class="flex gap-6">
                <a href="#"
                    class="text-gray-500 dark:text-gray-400 hover:text-purple-600 dark:hover:text-purple-400 transition-colors">{{
                    'footer.terms' | translate }}</a>
                <a href="#"
                    class="text-gray-500 dark:text-gray-400 hover:text-purple-600 dark:hover:text-purple-400 transition-colors">{{
                    'footer.privacy' | translate }}</a>
            </div>
        </div>
    </div>
</footer>
