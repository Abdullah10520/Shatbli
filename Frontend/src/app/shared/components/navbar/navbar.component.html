<header
    class="sticky top-0 z-40 bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm border-b border-gray-200 dark:border-gray-700">
    <nav class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <!-- الشعار -->
            <div class="flex items-center gap-2">
                <img src="/assets/images/logo.png" [alt]="'app.name' | translate" class="h-8 w-auto">
                <span class="text-2xl font-bold text-gray-800 dark:text-white">{{ 'app.name' | translate }}</span>
            </div>

            <!-- القائمة -->
            <div class="hidden md:flex items-center gap-8">
                <a routerLink="/studio" class="text-sm font-medium text-purple-600 dark:text-purple-400">{{
                    'nav.studio' | translate }}</a>
                <a routerLink="/subscription"
                    class="text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-purple-600 dark:hover:text-purple-400">{{
                    'nav.subscription' | translate }}</a>
            </div>

            <!-- المستخدم وزر الوضع واللغة -->
            <div class="flex items-center gap-3">
                <app-language-switcher />
                <app-theme-toggle />

                @if (currentUser()) {
                <div class="flex items-center gap-3">
                    <a routerLink="/profile"
                        class="text-sm text-gray-600 dark:text-gray-300 hover:text-purple-600 dark:hover:text-purple-400 hidden sm:block">{{
                        currentUser()?.fullName }}</a>
                    <button (click)="logout()"
                        class="text-sm text-red-500 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300 font-medium">
                        {{ 'nav.logout' | translate }}
                    </button>
                </div>
                }
            </div>
        </div>
    </nav>
</header>
